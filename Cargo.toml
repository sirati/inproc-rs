
[workspace]
resolver = "3"
members = ["crates/inproc"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2"

[workspace.dependencies.bytemuck]
version = "1.24"
features = ["derive", "min_const_generics"]

[workspace.dependencies.log]
version = "0.4"
features = ["std"]

[profile]

[profile.dev]

[profile.dev.package]

[profile.dev.package."*"]
opt-level = 2

[patch]

[patch.crates-io]
